# Default: api + worker use host networking (Linux lab / LXC — share host VPN/LAN routes).
#   docker compose up -d
#   UI: http://127.0.0.1:8000
#   config.docker.yaml → redis.url: redis://127.0.0.1:6379/0
#
# Bridge network (isolated, old default) — Docker Desktop Mac or locked-down hosts:
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d
#   UI: http://127.0.0.1:8001  · redis.url: redis://redis:6379/0
#
# Docker Desktop on Mac: host networking is the Linux VM, NOT the Mac VPN.
# For Mac lab with VPN PBS, use: ./scripts/lab-mac.sh
#
# Offline / air-gap: see DOCKER.md and scripts/build-offline-bundle.sh
#
# Optional observability:
#   docker compose --profile observability up -d
#   Grafana http://localhost:3002

services:
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    ports:
      # Published for host-networked api/worker. Use 6380 to avoid clashing with a
      # host Redis already on :6379 (common on Mac). config → redis://127.0.0.1:6380/0
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      args:
        RESTORE_ENGINE_VERSION: ${RESTORE_ENGINE_VERSION:-0.2.0}
        RESTORE_ENGINE_GIT_REVISION: ${RESTORE_ENGINE_GIT_REVISION:-unknown}
    image: ghcr.io/robertlukan/restore-engine:${RESTORE_ENGINE_IMAGE_TAG:-0.2.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    network_mode: host
    environment:
      RESTORE_ENGINE_CONFIG: /app/config.docker.yaml
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml

  worker:
    image: ghcr.io/robertlukan/restore-engine:${RESTORE_ENGINE_IMAGE_TAG:-0.2.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    network_mode: host
    environment:
      RESTORE_ENGINE_CONFIG: /app/config.docker.yaml
    command: ["python", "worker.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,yaml,redis; p=os.environ.get('RESTORE_ENGINE_CONFIG','/app/config.docker.yaml'); cfg=yaml.safe_load(open(p)); r=redis.from_url(cfg['redis']['url'], decode_responses=True); k=(cfg.get('redis') or {}).get('worker_heartbeat_key','restore:worker:heartbeat'); sys.exit(0 if r.get(k) else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.114.0
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    volumes:
      - ./deploy/observability/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.1
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - prometheus
    networks: [restore]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"

networks:
  restore:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
