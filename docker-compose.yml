# Offline runtime: no outbound internet required once images are present.
# Build / pull on a connected host, then docker save | docker load on the lab machine.
#
#   docker compose build
#   docker compose up -d
#   open http://localhost:8001  (dashboard; login = ui.password in config)
#
# Override config (recommended for real secrets):
#   cp config.docker.example.yaml config.docker.yaml
#   # edit config.docker.yaml — keep redis.url host as "redis"
#   docker compose up -d
#
# Uncomment the api/worker volumes section to mount ./config.docker.yaml
#
# Build on Apple Silicon but deploy on Intel/AMD64 Linux: keep `platform: linux/amd64` below.
# For native ARM64 builds on Mac (local test only), comment out all `platform` lines.
#
# Optional observability (Grafana + Prometheus + OTel Collector):
#   docker compose --profile observability up -d
#   Grafana http://localhost:3002  (admin / see GRAFANA_ADMIN_PASSWORD)
#   Point PVE/PBS Metric Server OpenTelemetry at <host>:4318
#   See docs/infra-metrics.md
# Host ports avoid clashing with a typical second Grafana (:3000/:3001) on the same box.

services:
  # In-container Redis only (not published to the host by default). Safe alongside a
  # separate Redis already installed on the host — see DOCKER.md "Redis already on the server".
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      args:
        RESTORE_ENGINE_VERSION: ${RESTORE_ENGINE_VERSION:-0.1.0}
        RESTORE_ENGINE_GIT_REVISION: ${RESTORE_ENGINE_GIT_REVISION:-unknown}
    image: restore-engine:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks: [restore]
    ports:
      - "8001:8000"
    environment:
      RESTORE_ENGINE_CONFIG: /app/config.docker.yaml
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml

  worker:
    image: restore-engine:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks: [restore]
    environment:
      RESTORE_ENGINE_CONFIG: /app/config.docker.yaml
    command: ["python", "worker.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,yaml,redis; p=os.environ.get('RESTORE_ENGINE_CONFIG','/app/config.docker.yaml'); cfg=yaml.safe_load(open(p)); r=redis.from_url(cfg['redis']['url'], decode_responses=True); k=(cfg.get('redis') or {}).get('worker_heartbeat_key','restore:worker:heartbeat'); sys.exit(0 if r.get(k) else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.114.0
    platform: linux/amd64
    restart: unless-stopped
    networks: [restore]
    volumes:
      - ./deploy/observability/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC (PVE/PBS Metric Server)
      - "4318:4318"   # OTLP HTTP

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.1
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - prometheus
    networks: [restore]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"

networks:
  restore:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
