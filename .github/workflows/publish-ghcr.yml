name: Publish GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag recommended, e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/robertlukan/restore-engine

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Resolve version metadata
        id: meta
        run: |
          REF="${{ github.event.release.tag_name || inputs.ref }}"
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            RESTORE_ENGINE_VERSION=${{ steps.meta.outputs.version }}
            RESTORE_ENGINE_GIT_REVISION=${{ steps.meta.outputs.git_revision }}

      - name: Summary
        run: |
          echo "Published ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} and :latest"
          echo "Pull: docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
