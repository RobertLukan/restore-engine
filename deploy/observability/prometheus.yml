# Scrape Netdata on PVE nodes and the OTel Collector Prometheus exporter.
# Copy targets from prometheus.targets.example.yml into the netdata-pve job below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          role: otel

  - job_name: netdata-pve
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
    scrape_interval: 10s
    # Add your PVE Netdata endpoints (host:19999). Example RFC5737 placeholders:
    # static_configs:
    #   - targets: ["203.0.113.10:19999"]
    #     labels:
    #       role: pve
    #       instance: "pve1"
    static_configs: []
