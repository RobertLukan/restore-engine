ui:
  password: "change-me-dashboard"
  session_secret: "change-me-use-a-long-random-string-at-least-32-chars"

pbs_servers:
  - id: main
    host: "10.0.0.10"
    port: 8007
    verify_ssl: false
    # Prefer token when set; otherwise username/password ticket auth.
    api_token_id: ""
    api_token_secret: ""
    user: "root@pam"
    password: "CHANGE_ME"
    mounts:
      - datastore: "main"
        namespace: ""
        pve_storage: "pbs-main"

proxmox:
  host: "10.0.0.20"
  port: 8006
  verify_ssl: false
  default_node: pve
  api_token_id: ""
  api_token_secret: ""
  user: root@pam
  password: "CHANGE_ME"
  storage: local-lvm
  restore_bwlimit: 0
  live_restore_default: false

redis:
  url: redis://redis:6379/0
  queue_key: restore:queue
  job_key_prefix: "restore:job:"
  job_log_suffix: :log
  tag_cache_prefix: "restore:tagcache:"

worker:
  task_poll_interval_sec: 3
  max_concurrent_restores: 2
  plan_check_interval_sec: 86400
  report_retain: 20
  job_ttl_sec: 1209600
  audit_retain: 2000
  # When true, POST /api/plans/{id}/run rejects plans that are not VERIFIED
  # unless allow_unverified=true is sent. Keep false for lab convenience;
  # set true for production (see README "Production checklist").
  require_verified_to_run: false
  # Default QGA wait when UI enables "Wait for guest agent" (seconds).
  qga_wait_sec_default: 120

# Optional automation tokens (Authorization: Bearer <token>).
# role: operator (full) | viewer (GET only)
# ui:
#   password: "change-me"
#   session_secret: "long-random-string"
#   api_tokens:
#     - name: ci
#       token: "long-random-secret"
#       role: operator

# Optional plans section (same require_verified_to_run key is also read here).
# plans:
#   require_verified_to_run: true

notifications:
  email:
    enabled: false
    host: ""
    port: 587
    tls: true
    ssl: false
    username: ""
    password: ""
    from: "restore-engine@example.com"
    to: []
  webhook:
    enabled: false
    url: ""
    secret: ""
  events:
    check_failed: true
    plan_run_terminal: true
    job_failed: false
