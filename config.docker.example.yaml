ui:
  password: change-me-dashboard
  session_secret: change-me-use-a-long-random-string-at-least-32-chars
  timezone: UTC
  # Opt-in: show Plans Cleanup UI and allow /api/cleanup/* (default false).
  plan_run_cleanup_enabled: false
pbs_servers:
- id: main
  host: 10.0.0.10
  port: 8007
  verify_ssl: false
  api_token_id: ''
  api_token_secret: ''
  user: root@pam
  password: CHANGE_ME
  mounts:
  - datastore: main
    namespace: ''
    pve_cluster_id: default
    pve_storage: pbs-main
pve_clusters:
- id: default
  host: 10.0.0.20
  port: 8006
  verify_ssl: false
  timeout_sec: 30
  default_node: pve
  api_token_id: ''
  api_token_secret: ''
  user: root@pam
  password: CHANGE_ME
  storage: local-lvm
  restore_bwlimit: 0
  live_restore_default: false
redis:
  url: redis://127.0.0.1:6380/0
  queue_key: restore:queue
  job_key_prefix: 'restore:job:'
  job_log_suffix: :log
  tag_cache_prefix: 'restore:tagcache:'
worker:
  task_poll_interval_sec: 3
  task_timeout_sec: 0
  # Destroy/disk-purge wait; 0 = unlimited (safe for multi-TiB guests).
  destroy_task_timeout_sec: 0
  max_concurrent_restores: 2
  enqueue_largest_first: true
  plan_check_interval_sec: 86400
  report_retain: 20
  job_ttl_sec: 1209600
  audit_retain: 2000
  require_verified_to_run: false
  qga_wait_sec_default: 120
monitoring:
  enabled: true
  api_snapshot: true
  grafana:
    base_url: ''
    dashboards:
    - id: infra
      title: Infra
      uid: restore-infra
      path: /d/restore-infra/restore-infra?orgId=1&kiosk&theme=dark
notifications:
  email:
    enabled: false
    host: ''
    port: 587
    tls: true
    ssl: false
    username: ''
    password: ''
    from: restore-engine@example.com
    to: []
  webhook:
    enabled: false
    url: ''
    secret: ''
  events:
    check_failed: true
    plan_run_terminal: true
    job_failed: false
